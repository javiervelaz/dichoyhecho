# api.dichoyhecho.ar -> worker. TLS con certificado por desafío DNS de Cloudflare (certbot-dns-cloudflare).
server {
    listen 443 ssl http2;
    server_name api.dichoyhecho.ar;

    ssl_certificate     /etc/letsencrypt/live/api.dichoyhecho.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dichoyhecho.ar/privkey.pem;

    client_max_body_size 5m;

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location /jobs/ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / { return 404; }
}

server {
    listen 80;
    server_name api.dichoyhecho.ar;
    return 301 https://$host$request_uri;
}
